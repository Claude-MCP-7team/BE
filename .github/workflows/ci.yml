name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ypc_test
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: 린트 (역할 경계 포함)
        run: ruff check .

      - name: 마이그레이션 적용
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d ypc_test -v ON_ERROR_STOP=1 \
               -f db/migrations/0001_init.sql

      - name: DB 제약조건 검증
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d ypc_test -f db/verify_schema.sql

      - name: 단위 테스트 (DB 통합 테스트 포함)
        env:
          # 이 값이 없으면 세션 저장소 테스트가 조용히 skip 된다.
          # 안 도는 테스트는 없는 테스트다.
          # 비밀번호는 DSN 에 박지 않고 PGPASSWORD 로 준다 (asyncpg 가 libpq 환경변수를
          # 읽는다) — DSN 이 로그나 에러 메시지에 그대로 찍히는 경로가 많다.
          DATABASE_URL: postgresql://postgres@localhost:5432/ypc_test
          PGPASSWORD: postgres
        run: pytest

      - name: DB 통합 테스트가 실제로 실행됐는지 확인
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/ypc_test
          PGPASSWORD: postgres
        run: |
          # skip 된 채로 초록불이 뜨면 DB 계층이 검증되지 않은 채 배포된다
          pytest tests/unit/test_db_sessions.py -q --no-header -p no:cacheprovider \
            | tee /tmp/db-tests.log
          if grep -qE '[0-9]+ skipped' /tmp/db-tests.log; then
            echo "::error::DB 통합 테스트가 skip 되었습니다 — DATABASE_URL 을 확인하세요"
            exit 1
          fi

      - name: 계약 스키마가 최신인지 확인
        run: |
          python tools/export_contract.py
          git diff --exit-code docs/contracts/ || {
            echo "::error::계약 스키마가 코드와 다릅니다. python tools/export_contract.py 를 실행하고 커밋하세요"
            exit 1
          }

      - name: 엔진 벤치마크 (성능 회귀 감시)
        run: python bench/engine_bench.py

  # 한국어 Windows 는 기본 인코딩이 cp949 다. ubuntu 러너는 UTF-8 이라
  # encoding 을 생략한 파일 입출력이 여기서는 통과하고 팀원 기계에서만 죽는다.
  # 실제로 그렇게 터진 적이 있어서 (test_db_contract.py, UnicodeDecodeError)
  # 로캘이 다른 환경을 CI 에 한 칸 둔다.
  windows-cp949:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 의존성 설치
        run: pip install -e ".[dev]"

      - name: 단위 테스트 (cp949 로캘)
        env:
          # 파이썬의 UTF-8 모드를 끈다 = 로캘 기본 인코딩(cp949)을 그대로 쓴다
          PYTHONUTF8: "0"
        run: pytest

      - name: 계약 내보내기 (cp949 로캘)
        env:
          PYTHONUTF8: "0"
        run: python tools/export_contract.py
